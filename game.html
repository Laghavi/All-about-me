<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Gallery</title>
    <style>
        /* Page Styling */
body {
    margin: 0;
    padding: 30px;
    font-family: Arial, Helvetica, sans-serif;
    background: #1e1e2f;
    color: white;
    text-align: center;
}

h1 {
    margin-bottom: 30px;
}

/* Grid Layout */
.game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: auto;
}

/* Card */
.game-grid a {
    text-decoration: none;
    background: #2d2d44;
    border-radius: 12px;
    overflow: hidden;
    color: white;
    transition: transform 0.3s, box-shadow 0.3s;
}

.game-grid a:hover {
    transform: translateY(-8px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

/* Image */
.game-grid img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
}

/* Game Name */
.game-grid p {
    margin: 15px 0;
    font-size: 20px;
    font-weight: bold;
}



    </style>
<body>

    <h1>🎮 Popular Games</h1>

    <div class="game-grid">

        <a href="https://www.minecraft.net/" target="_blank">
            <img src="Firefly_Gemini Flash_roblox game a boy playing 669535.png" alt="Minecraft">
            <p>Minecraft</p>
        </a>

        <a href="https://www.roblox.com/" target="_blank">
            <img src="Firefly_Gemini Flash_roblox game a boy playing 669535.png" alt="Roblox">
            <p>Roblox</p>
        </a>

        <a href="https://www.fortnite.com/" target="_blank">
            <img src="Firefly_Gemini Flash_use the reference image and , use cartoonish style, in a tennis court playing tennis, 669535.png" alt="Fortnite">
            <p>Fortnite</p>
        </a>

        <a href="https://genshin.hoyoverse.com/" target="_blank">
            <img src="images/genshin.jpg" alt="Genshin Impact">
            <p>Genshin Impact</p>
        </a>

        <a href="https://playvalorant.com/" target="_blank">
            <img src="images/valorant.jpg" alt="Valorant">
            <p>Valorant</p>
        </a>

        <a href="https://www.leagueoflegends.com/" target="_blank">
            <img src="images/lol.jpg" alt="League of Legends">
            <p>League of Legends</p>
        </a>

    </div>

</body>
</html>
